# /etc/sysctl.d/custom.cfg - configuration du noyau KERNEL16DOS
# Lignes "cle = valeur" ; # ou ; pour un commentaire.

# Limites du noyau
fs.files = 20
kernel.buffers = 20
kernel.lastdrive = F

# Interpreteur de commandes
kernel.shell = \BIN\SH.EXE

# Pilotes et programmes residents (facultatif)
# kernel.device = \DEVLOAD.EXE
# kernel.install = \BIN\MOUSE.EXE

# Variables d'environnement du premier programme
env.PATH = \BIN;B:\BIN
env.HOME = \
env.USER = root
env.HOSTNAME = linux0

# Langue : EN anglais, GR allemand, SP espagnol, IT italien
# (francais par defaut)
# env.LANGUAGE = EN
